# docker-compose.yml — rpodder development & deployment
#
# Profiles:
#   dev        PostgreSQL + dev server with cargo-watch live reload
#   release    PostgreSQL + production release build
#   sqlite     Self-contained SQLite mode (no external DB)
#   frontend   Standalone Svelte frontend (nginx) + API backend
#
# Usage:
#   docker compose --profile dev up -d            # dev mode (cargo-watch)
#   docker compose --profile release up -d        # release mode
#   docker compose --profile sqlite up -d         # sqlite mode
#
# Create a user:
#   docker compose --profile sqlite exec rpodder-sqlite rpodder user create myuser mypass

x-rpodder-labels: &rpodder-labels
  org.opencontainers.image.title: rpodder
  org.opencontainers.image.description: A modern, self-hostable gpodder.net replacement written in Rust
  org.opencontainers.image.url: https://thekoma.github.io/rpodder/
  org.opencontainers.image.source: https://github.com/thekoma/rpodder
  org.opencontainers.image.documentation: https://thekoma.github.io/rpodder/
  org.opencontainers.image.vendor: thekoma
  org.opencontainers.image.licenses: AGPL-3.0-or-later

x-rpodder-healthcheck: &rpodder-healthcheck
  test: ["CMD-SHELL", "curl -sf http://localhost:3005/health || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (only starts with dev/release profiles)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rpodder
      POSTGRES_PASSWORD: rpodder
      POSTGRES_DB: rpodder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpodder"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - dev
      - release

  # ---------------------------------------------------------------------------
  # rpodder — development mode with live reload
  # ---------------------------------------------------------------------------
  rpodder:
    build:
      context: .
      dockerfile: Dockerfile.dev
    labels:
      <<: *rpodder-labels
      com.docker.compose.description: "rpodder (dev mode, cargo-watch)"
    ports:
      - "3006:3005"
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    env_file:
      - path: .env.oauth
        required: false
    environment:
      RPODDER_DATABASE_URL: postgres://rpodder:rpodder@postgres:5432/rpodder
      RPODDER_PORT: "3005"
      RPODDER_MIGRATIONS_DIR: migrations
      RUST_LOG: rpodder=debug,tower_http=debug
      RUST_BACKTRACE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  # ---------------------------------------------------------------------------
  # rpodder — production-like release build (PostgreSQL)
  # ---------------------------------------------------------------------------
  rpodder-release:
    image: ${RPODDER_IMAGE:-rpodder}
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      <<: *rpodder-labels
      com.docker.compose.description: "rpodder (release build)"
    ports:
      - "3005:3005"
      - "9091:9091"
    env_file:
      - path: .env.oauth
        required: false
    environment:
      RPODDER_DATABASE_URL: postgres://rpodder:rpodder@postgres:5432/rpodder
      RPODDER_PORT: "3005"
      RPODDER_METRICS_ENABLED: "true"
      RPODDER_METRICS_PORT: "9091"
      RPODDER_MIGRATIONS_DIR: /app/migrations
    healthcheck:
      <<: *rpodder-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - release

  # ---------------------------------------------------------------------------
  # rpodder — self-hosted SQLite mode (no external DB needed)
  # ---------------------------------------------------------------------------
  rpodder-sqlite:
    image: ${RPODDER_IMAGE:-rpodder}
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      <<: *rpodder-labels
      com.docker.compose.description: "rpodder (SQLite mode)"
    ports:
      - "3005:3005"
    volumes:
      - sqlite-data:/app/data
    environment:
      RPODDER_DATABASE_URL: sqlite:///app/data/rpodder.db
      RPODDER_PORT: "3005"
      RPODDER_MIGRATIONS_DIR: /app/migrations
    healthcheck:
      <<: *rpodder-healthcheck
    profiles:
      - sqlite

  # ---------------------------------------------------------------------------
  # Mock RSS server for integration tests
  # ---------------------------------------------------------------------------
  mock-rss:
    build:
      context: tests/docker
      dockerfile: mock-rss.Dockerfile
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/stats"]
      interval: 3s
      timeout: 2s
      retries: 3
    profiles:
      - test

  # ---------------------------------------------------------------------------
  # Standalone frontend (Svelte SPA served by nginx)
  # ---------------------------------------------------------------------------
  rpodder-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    labels:
      <<: *rpodder-labels
      com.docker.compose.description: "rpodder web UI (nginx)"
    ports:
      - "8080:8080"
    depends_on:
      rpodder-api:
        condition: service_started
    profiles:
      - frontend

  # API-only backend (no embedded UI) for separate frontend
  rpodder-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CARGO_BUILD_FLAGS: "--no-default-features"
    labels:
      <<: *rpodder-labels
      com.docker.compose.description: "rpodder API (no UI)"
    ports:
      - "3005:3005"
    volumes:
      - sqlite-data:/app/data
    environment:
      RPODDER_DATABASE_URL: sqlite:///app/data/rpodder.db
      RPODDER_PORT: "3005"
      RPODDER_MIGRATIONS_DIR: /app/migrations
    profiles:
      - frontend

volumes:
  pgdata:
  cargo-cache:
  target-cache:
  sqlite-data:
