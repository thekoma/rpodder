server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to rpodder backend
    location /api/ {
        proxy_pass http://rpodder-api:3005/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /subscriptions/ {
        proxy_pass http://rpodder-api:3005/subscriptions/;
        proxy_set_header Host $host;
    }

    location /search.json {
        proxy_pass http://rpodder-api:3005/search.json;
    }

    location /toplist/ {
        proxy_pass http://rpodder-api:3005/toplist/;
    }

    location /suggestions/ {
        proxy_pass http://rpodder-api:3005/suggestions/;
    }

    location /health {
        proxy_pass http://rpodder-api:3005/health;
    }

    location /metrics {
        proxy_pass http://rpodder-api:3005/metrics;
    }

    location /admin {
        proxy_pass http://rpodder-api:3005/admin;
    }

    # Cache static assets
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
