<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c4436" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11241d" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>rpodder</title>
  <script>
    // Apply the saved theme before first paint (no flash of the wrong theme).
    try {
      var t = localStorage.getItem('rpodder_theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  %sveltekit.head%
</head>
<body data-sveltekit-prerender="true">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
