[workspace]
resolver = "2"
members = [
    "crates/rpodder-server",
    "crates/rpodder-core",
    "crates/rpodder-db",
    "crates/rpodder-feed",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TODO/rpodder"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono", "uuid"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# types
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }

# feed parsing
feed-rs = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }

# auth & crypto
argon2 = "0.5"
rand = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# config & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.14"
thiserror = "2"
anyhow = "1"

# internal crates
rpodder-core = { path = "crates/rpodder-core" }
rpodder-db = { path = "crates/rpodder-db" }
rpodder-feed = { path = "crates/rpodder-feed" }
