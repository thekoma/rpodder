# rpodder configuration
# Copy to rpodder.toml and modify as needed.
# All settings can also be set via RPODDER_* environment variables.

# Database URL
# PostgreSQL: postgres://user:pass@host:5432/rpodder
# SQLite:     sqlite://rpodder.db
database_url = "sqlite://rpodder.db"

# Server bind address (default: 0.0.0.0)
# host = "0.0.0.0"
port = 3005

# Path to migrations directory
migrations_dir = "migrations"

# Run migrations on startup (disable only if you manage migrations manually)
# run_migrations = true

# Base URL for email links and OAuth callbacks
# base_url = "https://pod.example.com"

# Registration mode: "open" (anyone), "closed" (admin only), "invite" (email confirmation)
registration = "open"

# --- SMTP (for email confirmation when registration = "invite") ---
# smtp_host = "mail.example.com"
# smtp_port = 25
# smtp_user = ""
# smtp_password = ""
# smtp_from = "rpodder@example.com"
# smtp_security = "none"  # "none", "starttls", "tls"

# --- OAuth2/OIDC (for SSO login) ---
# oauth_issuer_url = "https://auth.example.com/application/o/rpodder/"
# oauth_client_id = "your-client-id"
# oauth_client_secret = "your-client-secret"
# oauth_provider_name = "Authentik"
