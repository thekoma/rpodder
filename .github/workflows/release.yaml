name: Build and Release

on:
  push:
    branches: ["main"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Tag
        id: calculate_tag
        run: |
          set -e

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Triggered by tag: ${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          PREFIX=$(date +'%Y.%m')
          echo "Prefix: $PREFIX"

          git fetch --tags

          LAST_TAG=$(git tag --list "${PREFIX}.*" | sort -V | tail -n 1)
          echo "Last tag found: $LAST_TAG"

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="${PREFIX}.0"
          else
            SUFFIX=${LAST_TAG#$PREFIX.}
            NEW_SUFFIX=$(echo "$SUFFIX" | awk '{print $1 + 1}')
            NEW_TAG="${PREFIX}.${NEW_SUFFIX}"
          fi

          echo "Calculated new tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thekoma/rpodder
          tags: |
            type=raw,value=${{ steps.calculate_tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RPODDER_BUILD_TAG=${{ steps.calculate_tag.outputs.tag }}
            RPODDER_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Push Git Tag
        if: success() && github.ref_type != 'tag'
        run: |
          NEW_TAG=${{ steps.calculate_tag.outputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.calculate_tag.outputs.tag }}
          generate_release_notes: true
