name: CI / Release

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/thekoma/rpodder

jobs:
  # -------------------------------------------------------------------------
  # Stage 1a: Format check (safe — no compilation, runs automatically)
  # -------------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # -------------------------------------------------------------------------
  # Stage 1b: Clippy + Test (compiles code — requires approval on PRs)
  #
  # On PRs this job uses the "ci" environment which requires a maintainer
  # review before running. This prevents malicious build.rs / proc-macros
  # from fork PRs from executing on our runners.
  #
  # On push to main/tags the environment is skipped (code already reviewed).
  # -------------------------------------------------------------------------
  check:
    name: Lint & Test
    needs: format
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'ci' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # rust-embed needs web/dist/ to exist
      - name: Create web dist placeholder
        run: mkdir -p web/dist && touch web/dist/index.html

      # Compiles + lint analysis
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # Reuses clippy build artifacts, only compiles test harnesses
      - name: Test
        run: cargo test --workspace

  # -------------------------------------------------------------------------
  # Stage 1c: Build Docker image (amd64, reused by integration tests)
  #
  # Builds once, pushes by digest to ghcr.io. Integration tests pull this
  # image instead of rebuilding. On release, this digest is merged with the
  # ARM build into a multi-arch manifest. The release binary is extracted
  # directly from this image — no separate compilation needed.
  # -------------------------------------------------------------------------
  docker-build-amd64:
    name: Docker (amd64)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            RPODDER_BUILD_TAG=ci-${{ github.sha }}
            RPODDER_BUILD_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64
          sbom: true
          provenance: true

      # Extract the release binary from the image for GitHub Releases
      - name: Extract binary from image
        run: |
          docker pull ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
          container_id=$(docker create ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }})
          docker cp "$container_id:/usr/local/bin/rpodder" rpodder-linux-amd64
          docker rm "$container_id"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-amd64
          path: rpodder-linux-amd64
          retention-days: 1

  # -------------------------------------------------------------------------
  # Stage 1d: Integration tests (reuse amd64 Docker image from Stage 1c)
  # -------------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.profile }})
    needs: docker-build-amd64
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        profile: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the image built in Stage 1c and pass it to the test script
      - name: Run integration tests
        env:
          RPODDER_IMAGE: ${{ env.REGISTRY_IMAGE }}@${{ needs.docker-build-amd64.outputs.digest }}
        run: ./tests/docker/run-integration.sh ${{ matrix.profile }}

      - name: Cleanup
        if: always()
        run: |
          docker compose --profile sqlite --profile release --profile test \
            down -v --remove-orphans 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Stage 2a: Calculate release tag (shared by all release jobs)
  # -------------------------------------------------------------------------
  release-tag:
    name: Release Tag
    needs: [check, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calculate_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next tag
        id: calculate_tag
        run: |
          set -e

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          PREFIX=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag --list "${PREFIX}.*" | sort -V | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="${PREFIX}.0"
          else
            SUFFIX=${LAST_TAG#$PREFIX.}
            NEW_TAG="${PREFIX}.$((SUFFIX + 1))"
          fi

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # Stage 2b: Build Docker ARM image + extract binary (native)
  #
  # The amd64 image was already built and tested in Stage 1c.
  # Only the ARM image needs building here. The binary is extracted
  # from the image for GitHub Releases (no separate cargo build).
  # -------------------------------------------------------------------------
  docker-build-arm64:
    name: Docker (arm64)
    needs: release-tag
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            RPODDER_BUILD_TAG=${{ needs.release-tag.outputs.tag }}
            RPODDER_BUILD_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64
          sbom: true
          provenance: true

      # Extract the release binary from the image for GitHub Releases
      - name: Extract binary from image
        run: |
          docker pull ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
          container_id=$(docker create ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }})
          docker cp "$container_id:/usr/local/bin/rpodder" rpodder-linux-arm64
          docker rm "$container_id"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-arm64
          path: rpodder-linux-arm64
          retention-days: 1

  # -------------------------------------------------------------------------
  # Stage 2c: Merge Docker manifests into multi-arch image
  #
  # Combines the amd64 digest (from Stage 1c, already tested) with the
  # arm64 digest (from Stage 2b) into a single multi-arch manifest.
  # Only runs after integration tests pass.
  # -------------------------------------------------------------------------
  docker-merge:
    name: Docker Manifest
    needs: [release-tag, docker-build-amd64, docker-build-arm64, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.release-tag.outputs.tag }}
            type=raw,value=latest

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${{ env.REGISTRY_IMAGE }}@${{ needs.docker-build-amd64.outputs.digest }} \
            ${{ env.REGISTRY_IMAGE }}@${{ needs.docker-build-arm64.outputs.digest }}

  # -------------------------------------------------------------------------
  # Stage 3: Tag + GitHub Release (after Docker manifest is ready)
  # -------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [release-tag, docker-build-amd64, docker-build-arm64, docker-merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Prepare release assets
        run: |
          sha256sum rpodder-linux-amd64 rpodder-linux-arm64 > checksums.sha256
          echo "### Binaries" >> release-notes.md
          echo '```' >> release-notes.md
          cat checksums.sha256 >> release-notes.md
          echo '```' >> release-notes.md

      - name: Push git tag
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.release-tag.outputs.tag }}
          git push origin ${{ needs.release-tag.outputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tag.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body_path: release-notes.md
          files: |
            rpodder-linux-amd64
            rpodder-linux-arm64
            checksums.sha256
