name: CI / Release

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: Lint + Test (fmt → clippy → test, single compilation)
  # -------------------------------------------------------------------------
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # rust-embed needs web/dist/ to exist
      - name: Create web dist placeholder
        run: mkdir -p web/dist && touch web/dist/index.html

      # Fast check first (no compilation)
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Compiles + lint analysis
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # Reuses clippy build artifacts, only compiles test harnesses
      - name: Test
        run: cargo test --workspace

  # -------------------------------------------------------------------------
  # Stage 2: Build & Release (only on main/tag, after tests pass)
  # -------------------------------------------------------------------------
  release:
    name: Build & Release
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next tag
        id: calculate_tag
        run: |
          set -e

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          PREFIX=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag --list "${PREFIX}.*" | sort -V | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="${PREFIX}.0"
          else
            SUFFIX=${LAST_TAG#$PREFIX.}
            NEW_TAG="${PREFIX}.$((SUFFIX + 1))"
          fi

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # --- Build standalone binaries (amd64 + arm64) ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-binaries

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Build binary (linux/amd64)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build binary (linux/arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare release assets
        run: |
          cp target/x86_64-unknown-linux-gnu/release/rpodder rpodder-linux-amd64
          cp target/aarch64-unknown-linux-gnu/release/rpodder rpodder-linux-arm64
          sha256sum rpodder-linux-amd64 rpodder-linux-arm64 > checksums.sha256
          echo "### Binaries" >> release-notes.md
          echo '```' >> release-notes.md
          cat checksums.sha256 >> release-notes.md
          echo '```' >> release-notes.md

      # --- Build & push multi-arch Docker image ---
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/thekoma/rpodder
          tags: |
            type=raw,value=${{ steps.calculate_tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RPODDER_BUILD_TAG=${{ steps.calculate_tag.outputs.tag }}
            RPODDER_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      # --- Tag + Release ---
      - name: Push git tag
        if: success() && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.calculate_tag.outputs.tag }}
          git push origin ${{ steps.calculate_tag.outputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.calculate_tag.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body_path: release-notes.md
          files: |
            rpodder-linux-amd64
            rpodder-linux-arm64
            checksums.sha256
