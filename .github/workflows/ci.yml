name: CI / Release

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Lint & Test
    needs: format
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'ci' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Create web dist placeholder
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  integration:
    name: Integration Tests
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v6

      - name: Run integration tests
        run: ./tests/docker/run-integration.sh ${{ matrix.profile }}

      - name: Cleanup
        if: always()
        run: |
          docker compose --profile sqlite --profile release --profile test \
            down -v --remove-orphans 2>/dev/null || true

  release-binaries:
    name: Build Binaries & GitHub Release
    needs: [check, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.calculate_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next tag
        id: calculate_tag
        run: |
          set -e
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          PREFIX=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag --list "${PREFIX}.*" | sort -V | tail -n 1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="${PREFIX}.0"
          else
            SUFFIX=${LAST_TAG#$PREFIX.}
            NEW_TAG="${PREFIX}.$((SUFFIX + 1))"
          fi
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-binaries

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends crossbuild-essential-arm64

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Build binary (linux/amd64)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build binary (linux/arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare release assets
        run: |
          cp target/x86_64-unknown-linux-gnu/release/rpodder rpodder-linux-amd64
          cp target/aarch64-unknown-linux-gnu/release/rpodder rpodder-linux-arm64
          sha256sum rpodder-linux-amd64 rpodder-linux-arm64 > checksums.sha256
          echo "### Binaries" >> release-notes.md
          echo '\`\`\`' >> release-notes.md
          cat checksums.sha256 >> release-notes.md
          echo '\`\`\`' >> release-notes.md

      - name: Push git tag
        if: success() && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.calculate_tag.outputs.tag }}
          git push origin ${{ steps.calculate_tag.outputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.calculate_tag.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body_path: release-notes.md
          files: |
            rpodder-linux-amd64
            rpodder-linux-arm64
            checksums.sha256

  build-docker-images:
    name: Build Docker Images
    needs: release-binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thekoma/rpodder

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/thekoma/rpodder,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            RPODDER_BUILD_TAG=${{ needs.release-binaries.outputs.tag }}
            RPODDER_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker-manifests:
    name: Merge Docker Manifests
    needs: [release-binaries, build-docker-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thekoma/rpodder
          tags: |
            type=raw,value=${{ needs.release-binaries.outputs.tag }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "ghcr.io/thekoma/rpodder@sha256:%s " *)
