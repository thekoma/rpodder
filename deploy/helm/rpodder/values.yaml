controllers:
  rpodder:
    containers:
      main:
        image:
          repository: ghcr.io/thekoma/rpodder
          tag: 2026.05.1
          pullPolicy: IfNotPresent
        env:
          RPODDER_DATABASE_URL: sqlite:///data/rpodder.db
          RPODDER_PORT: "3005"
          RPODDER_MIGRATIONS_DIR: /app/migrations
          RPODDER_REGISTRATION: open
          # Public URL — required for OAuth/SSO callbacks and email links.
          # RPODDER_BASE_URL: https://podcasts.example.com
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3005
              initialDelaySeconds: 10
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3005
              periodSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3005
              failureThreshold: 30
              periodSeconds: 5

service:
  main:
    controller: rpodder
    ports:
      http:
        port: 3005

ingress:
  main:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: podcasts.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    # tls:
    #   - secretName: rpodder-tls
    #     hosts:
    #       - podcasts.example.com

# SQLite persistence. For PostgreSQL, point RPODDER_DATABASE_URL at your DB
# (e.g. an external chart or managed instance) and you can disable this PVC.
persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    # storageClass: ""
    globalMounts:
      - path: /data
